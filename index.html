<style>
   *,
*::after,
*::before {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

*{
      cursor: url('flor.png'), auto !important;
}

:root {
    --dark-color: #000;
    --fl-speed: 0.8s;
    --speed-leaf: 2s;
    --petal-gradient-start: #007bb5; 
    --petal-gradient-mid: #4dd2ff; 
    --petal-gradient-end: #b3f0ff; 
    --petal-shadow: rgba(77, 210, 255, 0.4);
    --center-color-1: #001133;
    --center-color-2: #003366;
    --center-color-3: #001a33;
    --center-shadow: rgba(0, 51, 102, 0.6);
    --stem-gradient-1: #2d5016;
    --stem-gradient-2: #4a7c23;
    --stem-gradient-3: #6b8e23;
    --leaf-gradient-1: rgba(45, 80, 22, 0.6);
    --leaf-gradient-2: #4a7c23;
    --leaf-gradient-3: #6b8e23;
    --grass-color: #4a7c23;
}

html, body {

    min-height:100%;

    margin:0;

    overflow-x:hidden;

    overflow-y:auto;

    width:100%;

    font-family:"Indie Flower";

    background: linear-gradient(to bottom, #010514, #03132e, #052148, #072f62, #0a3d7d);
    background-attachment: fixed;
    position: relative;

}

#loading-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, #03132e, #010514);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

.loading-title {
    font-family: "Indie Flower", sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: #66ccff;
    text-shadow: 0 0 15px rgba(77, 210, 255, 0.8);
    margin-bottom: 50px;
    text-align: center;
    padding: 0 20px;
}

.speedometer {
    position: relative;
    width: 280px;
    height: 140px;
    border-top-left-radius: 140px;
    border-top-right-radius: 140px;
    background: #001133;
    border: 6px solid #007bb5;
    border-bottom: 0;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0, 123, 181, 0.6);
}

.gauge {
    position: absolute;
    top: 15px; left: 15px; right: 15px; bottom: 0;
    border-top-left-radius: 125px;
    border-top-right-radius: 125px;
    background: conic-gradient(from 270deg at 50% 100%, #4dd2ff 0%, #007bb5 50%, #ff3333 100%);
    opacity: 0.6;
}

.needle {
    position: absolute;
    bottom: -4px;
    left: 50%;
    width: 125px;
    height: 8px;
    background: #ff3333;
    border-radius: 4px;
    transform-origin: 0% 50%;
    transform: rotate(180deg);
    box-shadow: 0 0 15px red;
    transition: transform 0.05s linear;
    z-index: 2;
}

.needle::after {
    content: '';
    position: absolute;
    top: -6px; left: -10px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #000;
}

.speed-value {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: "Sour Gummy", sans-serif;
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 0 0 10px #4dd2ff;
    font-weight: bold;
    z-index: 3;
}

.start-btn {
    margin-top: 50px;
    padding: 15px 40px;
    background: linear-gradient(135deg, #007bb5, #4dd2ff);
    border-radius: 30px;
    font-family: "Sour Gummy", sans-serif;
    font-size: 1.5rem;
    color: #fff;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(77, 210, 255, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.2s;
    z-index: 10;
}

.start-btn.active {
    opacity: 1;
    pointer-events: auto;
    animation: pulse-btn 1.5s infinite alternate;
}

.start-btn.active:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(77, 210, 255, 1);
}

.loading-car-wrapper {
    position: absolute;
    bottom: 10vh;
    left: 400px;
    display: flex;
    align-items: center;
    z-index: 5;
    animation: loading-car-drive 3.5s linear infinite;
}

.loading-car-img {
    width: 200px;
    object-fit: contain;
    transform: scaleX(-1);
    filter: drop-shadow(0 0 15px rgba(255, 51, 51, 0.7));
}

.loading-turbo-trail {
    position: absolute;
    left: -160px;

    box-shadow: 0 0 20px #ff0000, 0 0 35px #ffaa00;
    border-radius: 10px;
}

@keyframes loading-car-drive {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(100vw + 600px)); }
}

@keyframes pulse-btn {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(77, 210, 255, 0.6); }
    100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(77, 210, 255, 1); }
}

#loading-screen.hidden {

.flowers, .love-title, .instructions {

.love-title {

    color: #ffffff;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
}

.instructions {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    color: #e6f7ff;
    font-size: 1.2rem;
    text-align: center;
    z-index: 100;
    width: 90%;
    animation: pulse-text 2s infinite alternate;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(77, 210, 255, 0.8);
}

@keyframes pulse-text {
    0% { opacity: 0.6; transform: translateX(-50%) scale(0.98); }
    100% { opacity: 1; transform: translateX(-50%) scale(1.02); text-shadow: 0 0 15px rgba(102, 204, 255, 1); }
}

#falling-flower-container {

}

#card-modal {
    position: fixed;
    top: 0;
    left: 0;

.flip-container {

    max-width: 450px;

.flipper {

}

.flipper.is-flipped {
    transform: rotateY(180deg);
}

.front, .back {

    display: flex;
    justify-content: center;
    align-items: center;
}

.front {

.back {

}

.love-card-img {

@keyframes float-magic {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    15% { opacity: 1; transform: translate(calc(-50% + (var(--x) * 0.2)), -5vmin) scale(1); }
    85% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)), -50vmin) scale(0.5); opacity: 0; }

@keyframes pulse-magic {
    0% { box-shadow: 0 0 4px #66ccff, 0 0 8px #0077ff; }

.flower__leaf {
    position: absolute; 
    bottom: 0; left: 50%; 
    width: 10vmin !important; 
    height: 18vmin !important; 
    border-radius: 50% 50% 40% 40% / 70% 70% 40% 40% !important;

.flower__leaf:nth-child(1) { --end-angle: 0deg; z-index: 4; }
.flower__leaf:nth-child(2) { --end-angle: -25deg; z-index: 3; }

.flower__line {
    width: 2vmin;
    background-image: linear-gradient(to left, rgb(0, 0, 0, 0.3), transparent, rgba(255, 255, 255, 0.2)),
                      linear-gradient(to top, transparent 10%, var(--stem-gradient-1), var(--stem-gradient-2), var(--stem-gradient-3));
    box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.7); animation: grow-flower-tree 4s backwards;
}
.flower__line__leaf {
    --w: 8vmin; --h: calc(var(--w) + 3vmin); position: absolute; top: 20%; left: 90%; width: var(--w); height: var(--h);
    border-top-right-radius: var(--h); border-bottom-left-radius: var(--h);
    background-image: linear-gradient(to top, var(--leaf-gradient-1), var(--leaf-gradient-2), var(--leaf-gradient-3));
    box-shadow: inset 0 0 1vmin rgba(0, 0, 0, 0.3);
}
.flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); }
.flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); }
.flower__line__leaf--3, .flower__line__leaf--4 {
    border-top-right-radius: 0; border-bottom-left-radius: 0; border-top-left-radius: var(--h);
    border-bottom-right-radius: var(--h); left: -460%; top: 12%; transform: rotate(-70deg) rotateY(30deg);
}
.flower__line__leaf--4 { top: 40%; }

    70% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

    position: absolute;
    width: 2.5vmin;
    height: 2.5vmin;
    background: #003366; 
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

}

    width: 4.5vmin;
    height: 3.5vmin;

    top: 50%;

    box-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.bow__loop--left {
    right: 0.8vmin;

    border-radius: 60% 20% 20% 60%;

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const audio = new Audio("love.mp3"); 
        audio.loop = false; 



        let progress = 0;
        const needle = document.getElementById('speed-needle');
        const speedValue = document.getElementById('speed-value');
        const startBtn = document.getElementById('start-btn');
        const loadingScreen = document.getElementById('loading-screen');

        const loadingInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 4) + 1;
            
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                startBtn.classList.add('active'); 
                speedValue.textContent = '100 KM/H';
            } else {
                speedValue.textContent = progress + ' KM/H';
            }
            
            const angle = 180 + (progress * 1.8);
            needle.style.transform = `rotate(${angle}deg)`;
        }, 60);

        startBtn.addEventListener('click', () => {

             audio.play();

            loadingScreen.classList.add('hidden'); 
            
            document.querySelector('.flowers').style.display = 'block';
            document.querySelector('.love-title').style.display = 'block';
            document.querySelector('.instructions').style.display = 'block';
            
            if (audio.paused) {
                audio.play().catch(error => {
                    console.log("Error reproduciendo el audio:", error);
                });
            }

            setInterval(createMagicLight, 400);
            setInterval(createFallingPetal, 700);

            setTimeout(() => {
                loadingScreen.remove();
            }, 800);
        });

        const allFlowers = document.querySelectorAll('.flower');
        const cardModal = document.getElementById('card-modal');
        const closeModalBtn = document.querySelector('.close-btn');
        
        const flipContainer = document.getElementById('flip-container');
        const flipper = document.getElementById('flipper');
        const modalFrontImage = document.getElementById('modal-front-image');
        const modalBackImage = document.getElementById('modal-back-image');

        const portadas = [
            'portada1.png', 'portada2.png', 'portada3.png', 
            'portada4.png', 'portada5.png', 'portada6.png', 'portada7.png'
        ];

        const cartas = [
            'carta1.jpg', 'carta3.jpg', 'carta5.jpg', 
            'carta2.jpg', 'carta4.jpg', 'carta6.jpg', 'carta7.jpg'
        ];

        const preloadedImages = [];
        portadas.concat(cartas).forEach(src => {
            const img = new Image();
            img.src = src;
            preloadedImages.push(img);
        });

        allFlowers.forEach((flower, index) => {
            flower.addEventListener('click', (e) => {
                e.stopPropagation(); 
                
                modalFrontImage.src = portadas[index % portadas.length];
                modalBackImage.src = cartas[index % cartas.length];
                
                cardModal.classList.add('show');
            });
        });

        flipContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            flipper.classList.toggle('is-flipped');
        });

        function closeModal() {
            cardModal.classList.remove('show');
            setTimeout(() => {
                flipper.classList.remove('is-flipped');
            }, 400); 
        }

        closeModalBtn.addEventListener('click', closeModal);

        cardModal.addEventListener('click', (e) => {
            if (e.target === cardModal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Esc') {
                if (cardModal.classList.contains('show')) {
                    closeModal();
                }
            }
        });

        const flowerCups = document.querySelectorAll('.flower__leafs');

        function createMagicLight() {
            if(flowerCups.length === 0) return;
            
            const randomFlower = flowerCups[Math.floor(Math.random() * flowerCups.length)];
            
            const light = document.createElement('div');
            light.classList.add('magic-light');
            
            const randomX = (Math.random() - 0.5) * 60; 
            light.style.setProperty('--x', randomX + 'px');
            
            const floatDuration = Math.random() * 4 + 7; 
            const pulseDuration = Math.random() * 0.5 + 0.8;
            
            light.style.animation = `float-magic ${floatDuration}s linear forwards, pulse-magic ${pulseDuration}s alternate infinite`;
            
            randomFlower.appendChild(light);
            
            setTimeout(() => {
                light.remove();
            }, floatDuration * 1000); 
        }
    
        const petalContainer = document.getElementById('falling-flower-container');
        
        function createFallingPetal() {
            const wrapper = document.createElement('div');
            wrapper.classList.add('petal-wrapper');
            
            wrapper.style.left = (Math.random() * 100) + 'vw';
            wrapper.style.animationDuration = (Math.random() * 10 + 12) + 's';

            const petal = document.createElement('div');
            petal.classList.add('falling-petal');
            
            const size = Math.random() * 8 + 10; 
            petal.style.width = size + 'px';
            petal.style.height = (size * 1.5) + 'px';
            
            petal.style.animationDuration = (Math.random() * 3 + 3) + 's'; 

            wrapper.appendChild(petal);
            petalContainer.appendChild(wrapper);
            
            setTimeout(() => {
                wrapper.remove();
            }, 23000); 
        }
    });
</script>
